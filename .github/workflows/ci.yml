name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r requirements-dev.txt

      - name: Pylint
        run: pylint app --fail-under=8

      - name: Pytest with coverage
        env:
          DATABASE_URL: sqlite:///./pytest_db.sqlite
        run: pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Build Sphinx docs
        run: |
          pip install sphinx sphinx-rtd-theme
          cd ../docs && make html

  deploy:
    runs-on: ubuntu-latest
    needs: test # Запускать только если тесты прошли успешно
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /var/www/marketplace
            cd /var/www/marketplace
            
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch --all
              git reset --hard origin/${{ github.ref_name }}
            fi
            
            if [ ! -f ".env" ]; then
              cp .env.example .env
            fi
            
            # 1. Тушим старый маркетплейс, освобождаем память
            docker compose down
            
            # 2. ЖЕСТКО ЧИСТИМ КЭШ СБОРКИ ДО НАЧАЛА НОВОЙ СБОРКИ
            # Это удалит те самые 6 ГБ кэша, но сохранит работающего VPN-бота
            docker builder prune -a -f
            
            # 3. Собираем и поднимаем новую версию
            docker compose up -d --build
            
            # 4. Чистим старые образы бэкенда, которые остались после замены
            docker system prune -f