name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Pylint
        run: pylint app --fail-under=8

      - name: Pytest with coverage
        env:
          DATABASE_URL: sqlite:///./pytest_db.sqlite
        run: pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Build Sphinx docs
        run: |
          pip install sphinx sphinx-rtd-theme
          cd ../docs && make html

  deploy:
    runs-on: ubuntu-latest
    needs: test # Запускать только если тесты прошли успешно
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets::SSH_HOST }}
          username: ${{ secrets::SSH_USER }}
          key: ${{ secrets::SSH_KEY }}
          script: |
            # Переходим в папку проекта (измените путь /var/www/marketplace на ваш актуальный)
            mkdir -p /var/www/marketplace
            cd /var/www/marketplace
            
            # Если репозиторий еще не склонирован на сервере, инициализируем
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch --all
              git reset --hard origin/${{ github.ref_name }}
            fi
            
            # Пересобираем и запускаем контейнеры в фоне
            docker compose down
            docker compose up -d --build
            
            # Очищаем неиспользуемые старые слои и образы, чтобы диск не забивался
            docker image prune -f